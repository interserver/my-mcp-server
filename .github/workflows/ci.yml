name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# The OpenAPI spec is NOT fetched over HTTP here, and that is deliberate.
#
# Cloudflare answers 403 to https://my.interserver.net/spec/openapi.yaml for any origin
# it does not recognise, so the `curl` this workflow used to run would fail on every
# push. Checking out the API repository gives CI the real spec with no network
# dependency; the alternative, a committed copy, is a copy that goes stale silently.

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The shared core is a private VCS dependency; CI needs a deploy key for it.
      # Two private repositories: the shared core (a composer dependency) and the API
      # repo (the source of the spec). One agent, both keys.
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.MCP_CORE_DEPLOY_KEY }}
            ${{ secrets.MYADMIN_DEPLOY_KEY }}

      - name: Check out the API repo for its OpenAPI spec
        uses: actions/checkout@v4
        with:
          repository: interserver/my
          path: .myadmin
          ssh-key: ${{ secrets.MYADMIN_DEPLOY_KEY }}

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      # Installs from the committed lock, so CI tests the version the deploy
      # installs. Both origin repos gitignored their lock while depending on
      # dev-main, which is why nobody could say what protocol version was served.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=512M --no-progress

      - name: Tests
        env:
          # Both are needed: the spec drives the integration tests, MYADMIN_ROOT drives
          # the scope-map parity check against OAuthScope. Absent, those tests skip
          # rather than fail — so if this step ever reports far fewer tests than it
          # should, the checkout above is what to look at.
          MCP_CLIENT_SPEC: ${{ github.workspace }}/.myadmin/public_html/spec/openapi.yaml
          MYADMIN_ROOT: ${{ github.workspace }}/.myadmin
        run: vendor/bin/phpunit

  conformance:
    # Two baselines, because the published CLI cannot yet speak the version we target.
    # tests/Conformance/run.sh runs both eras and diffs each against its committed
    # baseline, so a regression is a diff rather than a judgement call.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: |
            ${{ secrets.MCP_CORE_DEPLOY_KEY }}
            ${{ secrets.MYADMIN_DEPLOY_KEY }}
      - name: Check out the API repo for its OpenAPI spec
        uses: actions/checkout@v4
        with:
          repository: interserver/my
          path: .myadmin
          ssh-key: ${{ secrets.MYADMIN_DEPLOY_KEY }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --no-progress

      - name: Run the conformance suites and diff against the baselines
        env:
          MCP_CLIENT_SPEC: ${{ github.workspace }}/.myadmin/public_html/spec/openapi.yaml
        run: ./tests/Conformance/run.sh
