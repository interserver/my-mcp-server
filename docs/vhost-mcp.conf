# /etc/apache2/sites-available/310-mcp.conf
#
# mcp.interserver.net — the client and public MCP surfaces.
#
# Mirrors the mystage TLS block, with four deliberate differences. Each one is
# something that was found the hard way; none is stylistic.

<VirtualHost *:443>
    ServerName mcp.interserver.net
    DocumentRoot /home/sites/my-mcp-server/public_html

    SSLEngine on
    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile    /etc/letsencrypt/live/mcp.interserver.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/mcp.interserver.net/privkey.pem

    # ------------------------------------------------------------------ 1
    # ProxyErrorOverride MUST be off.
    #
    # The origin vhost (300-mystage.conf, lines 16 and 64) has it on. With it on,
    # Apache replaces the body of every proxied response >= 400 with its own HTML
    # error page. Headers survive — a WWW-Authenticate challenge still arrives —
    # but the JSON-RPC body does not, so every spec-required error becomes an
    # empty shell with the right status code:
    #
    #   -32020 header/_meta mismatch     -32021 missing client capability
    #   -32022 unsupported version       -32601 unimplemented method
    #
    # Proven on staging: the same request to /mcp/public.php returned Apache's
    # HTML, and to /mcp/public (no extension, so no proxy match) returned the real
    # {"code":-32600,"message":"Mcp-Session-Id header must be a valid UUID."}.
    #
    # This application routes extensionless URLs, so it would dodge the problem by
    # accident. Say it explicitly instead.
    ProxyErrorOverride off

    # ------------------------------------------------------------------ 2
    # No `ProxyPassMatch ^/(.*\.php(/.*)?)$`.
    #
    # That directive on the origin vhost is the only reason its deployment needed
    # three `oauth-protected-resource/**.php` stub files. Route everything through
    # the front controller instead.
    <IfModule mod_proxy_fcgi.c>
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm.sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>

    # ------------------------------------------------------------------ 3
    # Bearer tokens must survive PHP-FPM.
    #
    # Without both of these, $_SERVER['HTTP_AUTHORIZATION'] is empty and every
    # authenticated request looks anonymous.
    CGIPassAuth On
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /home/sites/my-mcp-server/public_html>
        # ------------------------------------------------------------- 4
        # Without -MultiViews, `Accept: application/json, text/event-stream`
        # is content-negotiated and returns 406 before PHP ever runs.
        Options -Indexes -MultiViews
        AllowOverride All
        DirectoryIndex index.php
        Require all granted
    </Directory>

    # GET and DELETE reach the application too: the SDK answers them with the 405
    # the specification requires, and an Apache-generated 405 carries no JSON-RPC
    # body.

    Header always set Strict-Transport-Security "max-age=31536000"

    ErrorLog  ${APACHE_LOG_DIR}/mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp-access.log combined

    SetEnv MCP_API_ORIGIN       https://my.interserver.net
    SetEnv MCP_PUBLIC_ORIGIN    https://mcp.interserver.net
    SetEnv MCP_AUTH_SERVER      https://my.interserver.net
    SetEnv MCP_ALLOWED_HOSTS    mcp.interserver.net
    SetEnv MCP_ALLOWED_ORIGINS  https://claude.ai,https://claude.com

    # This server's own confidential OAuth client, distinct from the admin
    # server's. The separation is what makes the `ext.ima` gate enforceable:
    # MyAdmin returns the account tier only to the admin credential, so this
    # server can never receive an admin flag — not even for a genuine admin
    # account. Neither of these two values is secret.
    SetEnv MCP_INTROSPECTION_URL       "https://my.interserver.net/apiv2/oauth/introspect"
    SetEnv MCP_INTROSPECTION_CLIENT_ID "mcp-client-introspect"
    # SetEnv MCP_INTROSPECTION_CLIENT_SECRET — supply out of band, from an
    # environment file readable only by the FPM pool user. The Kernel refuses to
    # boot with it missing rather than silently running unauthenticated.

    SetEnv MCP_REDIS_DSN        "redis://127.0.0.1:6379"
    SetEnv MCP_REDIS_PREFIX     "mcp:client:"

    # Cloudflare answers 403 to the origin for /spec/openapi.yaml, so the default
    # specSource cannot be fetched from here until the bypass rule for this host's
    # egress exists. Either add that rule, or point this at a local copy the deploy
    # drops in. Leaving both undone means the server boots with no tools.
    # SetEnv MCP_CLIENT_SPEC    "/home/sites/my-mcp-server/var/openapi.yaml"
</VirtualHost>

# Plain HTTP exists only to redirect.
<VirtualHost *:80>
    ServerName mcp.interserver.net
    Redirect permanent / https://mcp.interserver.net/
</VirtualHost>

# Staging is the same file with mcpstage.interserver.net throughout. Do not leave
# it un-hardened: an unhardened staging host is the soft target for exactly the
# credentials the production host protects.
