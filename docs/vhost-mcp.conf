# mcp.interserver.net — client + public MCP surfaces.
#
# INSTALLED AND PROVEN as /etc/apache2/sites-available/400-mcp-le-ssl.conf on
# 2026-09-04. This file is a copy of what is actually running, not a proposal.
#
# Companion: /etc/php/8.3/fpm/pool.d/mcp.conf, a dedicated FPM pool that carries
# MCP_INTROSPECTION_CLIENT_SECRET. It is separate from [www] so this process does
# not hold the ADMIN introspection credential — that separation is what makes the
# ext.ima gate meaningful. Caveat: both pools run as the same unix user on the
# same box, so this reduces exposure rather than isolating the way the plan's
# two-host design assumed.
#
<IfModule mod_ssl.c>
<VirtualHost 69.10.33.243:443>
    ServerAdmin support@interserver.net
    ServerName mcp.interserver.net
    DocumentRoot /home/sites/my-mcp-server/public_html
    DirectoryIndex index.php

    Header always append X-Frame-Options SAMEORIGIN
    Header set X-Permitted-Cross-Domain-Policies "none"
    Header always set Strict-Transport-Security "max-age=31536000"

    # ------------------------------------------------------------------ 1
    # MUST be off. With it on, Apache replaces the body of every proxied
    # response >= 400 with its own HTML. Headers survive, so a WWW-Authenticate
    # challenge still arrives, but the JSON-RPC body does not — every
    # spec-required error (-32020, -32021, -32022, -32601) becomes an empty
    # shell with the right status code.
    ProxyErrorOverride off

    # ------------------------------------------------------------------ 2
    # No `ProxyPassMatch ^/(.*\.php(/.*)?)$`. That directive is the sole reason
    # the origin deployment needed three .php stub files under /.well-known/.
    # No URL in this application ends in .php; everything routes through the
    # front controller.
    <IfModule mod_proxy_fcgi.c>
        <FilesMatch "\.php$">
            SetHandler "proxy:unix:/run/php/php8.3-fpm-mcp.sock|fcgi://localhost"
        </FilesMatch>
    </IfModule>

    # ------------------------------------------------------------------ 3
    # Without both, $_SERVER['HTTP_AUTHORIZATION'] is empty and every
    # authenticated request looks anonymous. CGIPassAuth is Directory/.htaccess
    # context only — Apache refuses to start with it at VirtualHost level.
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

    <Directory /home/sites/my-mcp-server/public_html>
        CGIPassAuth On

        # ------------------------------------------------------------- 4
        # Without -MultiViews, `Accept: application/json, text/event-stream` is
        # content-negotiated against files on disk and returns 406 before PHP runs.
        Options -Indexes -MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    SetEnv MCP_API_ORIGIN              "https://my.interserver.net"
    SetEnv MCP_PUBLIC_ORIGIN           "https://mcp.interserver.net"
    SetEnv MCP_AUTH_SERVER             "https://my.interserver.net"
    SetEnv MCP_ALLOWED_HOSTS           "mcp.interserver.net"
    SetEnv MCP_ALLOWED_ORIGINS         "https://claude.ai,https://claude.com"
    SetEnv MCP_INTROSPECTION_URL       "https://my.interserver.net/apiv2/oauth/introspect"
    SetEnv MCP_INTROSPECTION_CLIENT_ID "mcp-client-introspect"
    SetEnv MCP_REDIS_DSN               "redis://127.0.0.1:6379"
    SetEnv MCP_REDIS_PREFIX            "mcp:client:"
    # Cloudflare answers 403 to this origin for /spec/openapi.yaml, returning an
    # HTML challenge page. That parses as an empty spec, so the server comes up
    # with ZERO tools and logs nothing — it does not look like a failure at all.
    # Pointed at the file on this box, which is the same file the API serves
    # rather than a copy that can go stale. Remove this once the Cloudflare skip
    # rule for this host's egress exists (cf_agent_readiness.php specbypass).
    SetEnv MCP_CLIENT_SPEC             "/home/sites/mystage/public_html/spec/openapi.yaml"

    # MCP_INTROSPECTION_CLIENT_SECRET comes from the dedicated FPM pool
    # (/etc/php/8.3/fpm/pool.d/mcp.conf, mode 640) so it is not in this file.

    LogLevel warn
    ErrorLog  ${APACHE_LOG_DIR}/mcp-error.log
    CustomLog ${APACHE_LOG_DIR}/mcp-access.log combined

SSLCertificateFile /etc/letsencrypt/live/mcp.interserver.net/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/mcp.interserver.net/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
